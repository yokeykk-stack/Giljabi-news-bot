name: Public bot keepalive

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: giljabi-public-bot-maintenance
  cancel-in-progress: false

jobs:
  heartbeat:
    if: >-
      github.repository == 'yokeykk-stack/Giljabi-news-bot' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this public repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Record weekly repository activity
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > status/heartbeat.json <<JSON
          {
            "status": "active",
            "updatedAt": "$stamp",
            "purpose": "Prevent public scheduled workflows from being disabled after repository inactivity"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- status/heartbeat.json
          if git diff --cached --quiet; then
            echo "Heartbeat already current."
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore: refresh public bot heartbeat"
          git push origin HEAD:main
